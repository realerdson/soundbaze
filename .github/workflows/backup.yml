name: Daily database backup

# Dumps the Supabase Postgres DB to Cloudflare R2 every night at 02:00 UTC.
# R2 free tier: 10 GB storage, 1M reads/month — enough for 90 days of daily backups.
# Requires secrets: SUPABASE_DB_URL, R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET, R2_ENDPOINT

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install pg_dump
        run: sudo apt-get install -y postgresql-client

      - name: Dump Supabase DB
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FILENAME="soundbaze-$(date +%Y%m%d).dump"
          pg_dump "$DB_URL" \
            --no-owner --no-acl \
            --format=custom \
            --file="$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}
        run: |
          aws s3 cp "${{ env.BACKUP_FILE }}" \
            "s3://$R2_BUCKET/backups/${{ env.BACKUP_FILE }}" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Backup uploaded: ${{ env.BACKUP_FILE }}"

      - name: Prune backups older than 90 days
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}
        run: |
          CUTOFF=$(date -d "90 days ago" +%Y%m%d)
          aws s3 ls "s3://$R2_BUCKET/backups/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' \
            | while read FILE; do
                DATE=$(echo "$FILE" | grep -oP '\d{8}')
                if [[ "$DATE" < "$CUTOFF" ]]; then
                  aws s3 rm "s3://$R2_BUCKET/backups/$FILE" --endpoint-url "$R2_ENDPOINT"
                  echo "Deleted old backup: $FILE"
                fi
              done
