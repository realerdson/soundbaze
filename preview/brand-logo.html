<!DOCTYPE html><html><head><meta charset="utf-8"><title>Logo lockups</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 0; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; height: 220px; }
  .panel { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 24px; min-width: 0; }
  .light { background: var(--bg); }
  .dark { background: var(--carbon-black); }
  .wordmark { font-family: var(--font-sans); font-weight: 700; font-size: 42px; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
  .wordmark.fg { color: var(--charcoal-brown); }
  .wordmark.inv { color: var(--floral-white); }
  .mark { display:inline-flex; align-items:center; }
</style></head>
<body>
<div class="stage">
  <div class="panel light">
    <span class="mark"><svg width="48" height="48" viewBox="0 0 120 120"><g fill="#C9462C">
      <rect x="10"  y="68" width="14" height="38" rx="6"/>
      <rect x="34"  y="32" width="14" height="74" rx="6"/>
      <rect x="58"  y="50" width="14" height="56" rx="6"/>
      <rect x="82"  y="20" width="14" height="86" rx="6"/>
      <rect x="106" y="60" width="14" height="46" rx="6"/>
    </g></svg></span>
    <span class="wordmark fg">soundbaze</span>
  </div>
  <div class="panel dark">
    <span class="mark"><svg width="48" height="48" viewBox="0 0 120 120"><g fill="#C9462C">
      <rect x="10"  y="68" width="14" height="38" rx="6"/>
      <rect x="34"  y="32" width="14" height="74" rx="6"/>
      <rect x="58"  y="50" width="14" height="56" rx="6"/>
      <rect x="82"  y="20" width="14" height="86" rx="6"/>
      <rect x="106" y="60" width="14" height="46" rx="6"/>
    </g></svg></span>
    <span class="wordmark inv">soundbaze</span>
  </div>
</div>
</body></html>
