<!DOCTYPE html><html><head><meta charset="utf-8"><title>Badges & pills</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 22px 24px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .pill { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: var(--radius-pill); }
  .pill.neutral { background: var(--bg-sunken); color: var(--fg-muted); }
  .pill.strong { background: var(--charcoal-brown); color: var(--floral-white); font-weight: 600; }
  .pill.accent { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .pill.accent-tint { background: var(--accent-tint); color: var(--paprika-deep); font-weight: 600; }
  .pill.outline { background: transparent; border: 1px solid var(--border-strong); color: var(--fg-muted); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-subtle); width: 80px; }
</style></head>
<body>
<div class="row"><span class="label">Tags</span>
  <span class="pill neutral">indie rock</span>
  <span class="pill neutral">2024</span>
  <span class="pill neutral">5:42</span>
  <span class="pill outline">EP</span>
</div>
<div class="row"><span class="label">Status</span>
  <span class="pill accent"><span class="dot" style="background:var(--floral-white)"></span>Live</span>
  <span class="pill accent-tint">147 annotations</span>
  <span class="pill strong">Verified</span>
  <span class="pill neutral"><span class="dot" style="background:var(--success)"></span>Approved</span>
</div>
</body></html>
