<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: 60px 60px 1fr; gap: 14px; align-items: center; padding: 5px 0; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .size { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .bar { height: 18px; background: var(--accent); border-radius: 3px; }
</style></head>
<body>
<div class="row"><span class="tag">space-1</span><span class="size">4px</span><div class="bar" style="width:4px"></div></div>
<div class="row"><span class="tag">space-2</span><span class="size">8px</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="tag">space-3</span><span class="size">12px</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="tag">space-4</span><span class="size">16px</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="tag">space-6</span><span class="size">24px</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="tag">space-8</span><span class="size">32px</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="tag">space-12</span><span class="size">48px</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="tag">space-16</span><span class="size">64px</span><div class="bar" style="width:64px"></div></div>
<div class="row"><span class="tag">space-24</span><span class="size">96px</span><div class="bar" style="width:96px"></div></div>
</body></html>
