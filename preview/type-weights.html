<!DOCTYPE html><html><head><meta charset="utf-8"><title>Type weights</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--divider); }
  .row:last-child { border-bottom: none; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); }
  .sample { font-size: 22px; color: var(--fg); letter-spacing: -0.01em; }
</style></head>
<body>
<div class="row"><span class="tag">400 / Regular</span><span class="sample" style="font-weight:400">Every song has a second layer.</span></div>
<div class="row"><span class="tag">500 / Medium</span><span class="sample" style="font-weight:500">Every song has a second layer.</span></div>
<div class="row"><span class="tag">600 / Semibold</span><span class="sample" style="font-weight:600">Every song has a second layer.</span></div>
<div class="row"><span class="tag">700 / Bold</span><span class="sample" style="font-weight:700">Every song has a second layer.</span></div>
<div class="row"><span class="tag">400 / Italic</span><span class="sample" style="font-weight:400;font-style:italic">Every song has a second layer.</span></div>
<div class="row"><span class="tag">700 / Bold Italic</span><span class="sample" style="font-weight:700;font-style:italic">Every song has a second layer.</span></div>
</body></html>
