<!DOCTYPE html><html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--fg-muted); }
  .item svg { stroke: currentColor; }
  .item .n { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 10px; }
</style></head>
<body>
<div class="label">Lucide · 1.5px stroke · currentColor</div>
<div class="grid">
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m9 18 12-3V3l-12 3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="15" r="3"/></svg><span class="n">music</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="n">search</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg><span class="n">check</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="n">bookmark</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="n">heart</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="n">message</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="n">edit</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span class="n">disc</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg><span class="n">play</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span class="n">pause</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg><span class="n">clock</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 16 0v1"/></svg><span class="n">user</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg><span class="n">arrow-right</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><span class="n">chevron</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span class="n">plus</span></div>
  <div class="item"><svg width="22" height="22" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span class="n">more</span></div>
</div>
</body></html>
