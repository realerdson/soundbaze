<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_preview.css">
<style>
  body { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .item { display:flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 64px; height: 64px; background: var(--accent-tint); border: 1.5px solid var(--accent); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); text-align: center; }
</style></head>
<body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="name">xs · 6</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm · 10</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md · 14</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg · 20</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl · 28</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="name">2xl · 36</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="name">pill</div></div>
</div>
</body></html>
